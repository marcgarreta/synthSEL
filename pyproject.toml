[project]
name = "synthsel"
version = "0.1.0"
description = "Synthetic dynamic MS lesion generation in 3D FLAIR MRI for slowly expanding lesion (SEL) detection."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Marc Garreta Basora" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "nibabel>=5.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy deep-learning stack, only needed for diffusion-based synthesis (MSRepaint, LeFusion...)
dl = ["torch>=2.3", "monai>=1.4"]
viz = ["matplotlib>=3.8", "jupyter>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthsel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: tests that need real data or GPU (deselect with -m 'not slow')"]

[tool.coverage.run]
source = ["synthsel"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
